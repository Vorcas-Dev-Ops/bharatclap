version: '3.8'

services:
  # ----------------------------------------------------
  # INFRASTRUCTURE DATABASES
  # ----------------------------------------------------
  mongodb:
    image: mongo:latest
    container_name: serviceapp-mongodb
    ports:
      - "127.0.0.1:27018:27017" # Bound strictly to loopback to prevent external port scanning
    volumes:
      - mongodb_data:/data/db
    networks:
      - serviceapp-network

  redis:
    image: redis:alpine
    container_name: serviceapp-redis
    ports:
      - "127.0.0.1:6379:6379" # Bound strictly to loopback
    networks:
      - serviceapp-network

  # ----------------------------------------------------
  # MICROSERVICES
  # ----------------------------------------------------
  auth-service:
    build: ./auth-service
    container_name: serviceapp-auth-service
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/auth_db
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
    depends_on:
      - redis
      - mongodb
    networks:
      - serviceapp-network

  catalog-service:
    build: ./catalog-service
    container_name: serviceapp-catalog-service
    ports:
      - "127.0.0.1:5002:5002"
    environment:
      - PORT=5002
      - MONGO_URI=mongodb://mongodb:27017/catalog_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
    depends_on:
      - redis
      - mongodb
    networks:
      - serviceapp-network

  provider-service:
    build: ./provider-service
    container_name: serviceapp-provider-service
    ports:
      - "127.0.0.1:5003:5003"
    environment:
      - PORT=5003
      - MONGO_URI=mongodb://mongodb:27017/provider_db
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
    depends_on:
      - redis
      - mongodb
    networks:
      - serviceapp-network

  booking-service:
    build: ./booking-service
    container_name: serviceapp-booking-service
    ports:
      - "127.0.0.1:5004:5004"
    environment:
      - PORT=5004
      - MONGO_URI=mongodb://mongodb:27017/booking_db
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
    depends_on:
      - redis
      - mongodb
    networks:
      - serviceapp-network

  payment-service:
    build: ./payment-service
    container_name: serviceapp-payment-service
    ports:
      - "127.0.0.1:5005:5005"
    environment:
      - PORT=5005
      - MONGO_URI=mongodb://mongodb:27017/payment_db
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
    depends_on:
      - redis
      - mongodb
    networks:
      - serviceapp-network

  notification-service:
    build: ./notification-service
    container_name: serviceapp-notification-service
    ports:
      - "127.0.0.1:5006:5006"
    environment:
      - PORT=5006
      - MONGO_URI=mongodb://mongodb:27017/notification_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
    depends_on:
      - redis
      - mongodb
    networks:
      - serviceapp-network

  # ----------------------------------------------------
  # UNIFIED ENTRY API GATEWAY (Port 5000)
  # ----------------------------------------------------
  api-gateway:
    build: ./api-gateway
    container_name: serviceapp-api-gateway
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - AUTH_SERVICE_URL=http://auth-service:5001
      - CATALOG_SERVICE_URL=http://catalog-service:5002
      - PROVIDER_SERVICE_URL=http://provider-service:5003
      - BOOKING_SERVICE_URL=http://booking-service:5004
      - PAYMENT_SERVICE_URL=http://payment-service:5005
      - NOTIFICATION_SERVICE_URL=http://notification-service:5006
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,https://bharatclap.in
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
    depends_on:
      - auth-service
      - catalog-service
      - provider-service
      - booking-service
      - payment-service
      - notification-service
    networks:
      - serviceapp-network

networks:
  serviceapp-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
